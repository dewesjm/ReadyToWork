<header class="navbar gap-2 bg-primary px-4 text-primary-content shadow-sm">
  <a routerLink="/readiness" class="flex items-center gap-2 text-lg font-semibold">
    <svg class="size-6 text-accent" viewBox="0 0 24 24" fill="none" stroke="currentColor"
         stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <circle cx="12" cy="12" r="10" />
      <path d="m7.5 12 3 3 6-6" />
    </svg>
    <span>Ready to Work</span>
  </a>

  <nav class="ml-4 flex grow gap-1" aria-label="Main">
    @for (link of links(); track link.path) {
      <a
        [routerLink]="link.path"
        routerLinkActive="border-accent!"
        ariaCurrentWhenActive="page"
        class="border-b-2 border-transparent px-3 py-1 text-sm font-medium hover:border-accent/60"
      >
        {{ link.label }}
      </a>
    }
  </nav>

  <rtw-avatar-menu />
</header>

<rtw-announcement-banner />

<main class="w-full grow p-4 sm:p-6">
  <router-outlet />
</main>

<rtw-update-prompt />
