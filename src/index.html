<!doctype html>
<html lang="en" data-theme="navy">
<head>
  <meta charset="utf-8">
  <title>Ready to Work</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <script>
    // Apply the saved theme before Angular starts, so there is no flash of the default theme.
    try {
      var t = localStorage.getItem('rtw.theme');
      if (t && /^[a-z-]+$/.test(t)) document.documentElement.setAttribute('data-theme', t);
    } catch (e) {}
  </script>
</head>
<body>
  <rtw-root></rtw-root>
</body>
</html>
